<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Bloom Bastion — Grass (buildable) tile, TOP-DOWN to match the in-game proto
       (design-assets/screenshots/proto_game.png), NOT the isometric design-bible
       IsoTile in sprites_tiles.jsx (that diamond is for the bible art board).
       Greens from the iso source top/blade fills: #5fbf52 base, #7fe070 blades, #3f8a38 stroke.
       Authored at 64x64 so it tiles edge-to-edge on the grid; a faint hairline edge
       reads as the grid line seen in the proto. -->
  <rect width="64" height="64" fill="#5fbf52"/>
  <rect width="64" height="64" fill="none" stroke="#4ea846" stroke-width="1" opacity="0.5"/>
  <path d="M16 24 q2 -6 4 0" stroke="#3f8a38" stroke-width="1.4" fill="none" opacity="0.7"/>
  <path d="M40 18 q2 -6 4 0" stroke="#3f8a38" stroke-width="1.4" fill="none" opacity="0.7"/>
  <path d="M28 46 q2 -6 4 0" stroke="#3f8a38" stroke-width="1.4" fill="none" opacity="0.7"/>
  <path d="M48 44 q2 -6 4 0" stroke="#3f8a38" stroke-width="1.4" fill="none" opacity="0.7"/>
  <circle cx="22" cy="34" r="1.6" fill="#7fe070" opacity="0.8"/>
  <circle cx="44" cy="30" r="1.6" fill="#7fe070" opacity="0.8"/>
  <circle cx="34" cy="52" r="1.4" fill="#7fe070" opacity="0.8"/>
</svg>
