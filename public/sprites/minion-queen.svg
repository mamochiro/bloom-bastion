<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <!-- Bloom Bastion — Queen Bee minion (Hive tower L3 summon, SPEC §6.1). A larger, fancier bee
       with a gold crown accent — same SMALL-SPRITE CONVENTION as minion-bee but BIGGER:
       square 0 0 44 44 viewBox, geometry CENTERED on (22,22) for the RenderSystem 0.5/0.5 anchor
       (free-moving unit, no hex pedestal). Tokens (export/design-tokens.css → hex): gold #ffd700,
       gold-deep #d9a400, hive-light #ffe9b0, hive-mid #ffb74d, hive-dark #e07b1f, bg-deep #1a0f2e,
       blossom-mid #ff6fa5 (crown jewel). Orbit/flutter CSS deferred. -->
  <defs>
    <filter id="queen-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
      <feFlood flood-color="#ffb74d" flood-opacity="0.9"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="queen-crown-glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.95"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- wings (behind body) -->
  <ellipse cx="14" cy="20" rx="8.5" ry="5" fill="#fff" opacity="0.85" transform="rotate(-22 14 20)"/>
  <ellipse cx="30" cy="20" rx="8.5" ry="5" fill="#fff" opacity="0.85" transform="rotate(22 30 20)"/>
  <ellipse cx="13.5" cy="20" rx="4" ry="2.2" fill="#ffe9b0" opacity="0.6" transform="rotate(-22 13.5 20)"/>
  <ellipse cx="30.5" cy="20" rx="4" ry="2.2" fill="#ffe9b0" opacity="0.6" transform="rotate(22 30.5 20)"/>

  <g filter="url(#queen-glow)">
    <!-- body (larger, more elongated than worker) -->
    <ellipse cx="22" cy="25" rx="11" ry="8.5" fill="#ffd700"/>
    <ellipse cx="22" cy="22.5" rx="5.5" ry="3.4" fill="#ffe9b0" opacity="0.75"/>
    <!-- stripes -->
    <rect x="18.5" y="17.5" width="2.6" height="15" rx="1.3" fill="#1a0f2e"/>
    <rect x="24.5" y="17.5" width="2.6" height="15" rx="1.3" fill="#1a0f2e"/>
    <!-- royal stinger -->
    <path d="M33 25 l4.5 0 l-4.5 2.4 Z" fill="#e07b1f"/>
  </g>

  <!-- crown accent (above head) -->
  <g filter="url(#queen-crown-glow)" transform="translate(22 9)">
    <path d="M-7 4 L-7 -3 L-3.5 1 L0 -5 L3.5 1 L7 -3 L7 4 Z" fill="#ffd700" stroke="#d9a400" stroke-width="0.8"/>
    <circle cx="0" cy="-5.5" r="1.6" fill="#ff6fa5"/>
    <circle cx="-7" cy="-3" r="1.1" fill="#ffe9b0"/>
    <circle cx="7" cy="-3" r="1.1" fill="#ffe9b0"/>
  </g>

  <!-- face -->
  <circle cx="17" cy="23" r="1.9" fill="#1a0f2e"/>
  <circle cx="16.3" cy="22.3" r="0.7" fill="#fff"/>
  <circle cx="27" cy="23" r="1.9" fill="#1a0f2e"/>
  <circle cx="26.3" cy="22.3" r="0.7" fill="#fff"/>
  <path d="M19 27 q3 2.4 6 0" stroke="#1a0f2e" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
