<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <!-- Bloom Bastion — Hive tower, level 1 (summoner, SPEC §6.1, 125g). Source: design-assets/sprites_towers.jsx TowerHive({level:1}).
       Tokens (design-assets/export/design-tokens.css → resolved to hex; sprites are not CSS-var themed at runtime):
       hive-light #ffe9b0, hive-mid #ffb74d, hive-dark #e07b1f, gold #ffd700, bg-deep #1a0f2e.
       L1 = hex pedestal + stacked honeycomb hive (2 rows, designer's level===1) + a pair of baked orbiting
       bees + white glow core. honey-drip (L3) and extra rows (L2/L3) omitted. Idle bob / orbit / flutter CSS
       keyframes from the source are DEFERRED (juice slice). -->
  <defs>
    <!-- Static honey glow (replaces drop-shadow(0 0 7px hive-mid)). -->
    <filter id="hv1-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feFlood flood-color="#ffb74d" flood-opacity="0.9"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- hex pedestal -->
  <g>
    <ellipse cx="60" cy="140" rx="34" ry="9" fill="#000" opacity="0.28"/>
    <path d="M30 132 L60 122 L90 132 L90 138 L60 148 L30 138 Z" fill="#e07b1f"/>
    <path d="M30 132 L60 122 L90 132 L60 142 Z" fill="#ffb74d"/>
    <path d="M30 132 L60 142 L60 148 L30 138 Z" fill="#e07b1f" opacity="0.7"/>
  </g>

  <!-- stacked honeycomb hive (designer rows: y=116-i*18, r=22-i*3.2; flat-top hexagons) -->
  <g filter="url(#hv1-glow)">
    <!-- row 0 (y=116, r=22, hive-light) -->
    <polygon points="79.1 116.0 69.0 133.5 51.0 133.5 40.9 116.0 51.0 98.5 69.0 98.5" fill="#ffe9b0"/>
    <polygon points="70.5 116.0 64.9 125.6 55.1 125.6 49.5 116.0 55.1 106.4 64.9 106.4" fill="#e07b1f"/>
    <!-- row 1 (y=98, r=18.8, hive-mid) -->
    <polygon points="76.3 98.0 68.2 113.0 51.8 113.0 43.7 98.0 51.8 83.0 68.2 83.0" fill="#ffb74d"/>
    <polygon points="69.0 98.0 64.5 106.3 55.5 106.3 51.0 98.0 55.5 89.7 64.5 89.7" fill="#e07b1f"/>
    <!-- hive entrance hole -->
    <ellipse cx="60" cy="116" rx="5" ry="6" fill="#1a0f2e" opacity="0.85"/>
  </g>

  <!-- a pair of baked orbiting worker bees -->
  <g transform="translate(40 74)">
    <ellipse cx="0" cy="0" rx="4" ry="3" fill="#ffd700"/>
    <rect x="-1.5" y="-3" width="1.4" height="6" fill="#1a0f2e"/>
    <ellipse cx="-3" cy="-2" rx="3" ry="1.6" fill="#fff" opacity="0.8"/>
  </g>
  <g transform="translate(82 84)">
    <ellipse cx="0" cy="0" rx="4" ry="3" fill="#ffd700"/>
    <rect x="-1.5" y="-3" width="1.4" height="6" fill="#1a0f2e"/>
    <ellipse cx="3" cy="-2" rx="3" ry="1.6" fill="#fff" opacity="0.8"/>
  </g>

  <!-- glowing core orb (white / gold) -->
  <circle cx="60" cy="98" r="8" fill="#ffd700" opacity="0.16"/>
  <circle cx="60" cy="98" r="4" fill="#fff"/>
  <circle cx="60" cy="98" r="4" fill="#ffb74d" opacity="0.45"/>
  <circle cx="58.6" cy="96.6" r="1.4" fill="#fff" opacity="0.9"/>
</svg>
