<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Bloom Bastion — Blossom projectile (a single homing petal).
       Source intent: design-assets/sprites_towers.jsx Blossom "fires homing petals, trailing petal FX".
       Centered on (12,12) so the renderer can place/rotate it by its center.
       blossom-mid #ff6fa5, blossom-light #ffd6e8. Static glow baked. -->
  <defs>
    <filter id="proj-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
      <feFlood flood-color="#ff6fa5" flood-opacity="0.95"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#proj-glow)">
    <ellipse cx="12" cy="12" rx="5" ry="7.5" fill="#ff6fa5"/>
    <ellipse cx="12" cy="10" rx="2.4" ry="3.6" fill="#ffd6e8" opacity="0.85"/>
    <circle cx="12" cy="12" r="2" fill="#fff" opacity="0.9"/>
  </g>
</svg>
