<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Bloom Bastion — Flutter enemy (airborne, fast, low HP — §6.2: Flying tier).
       Source: design-assets/sprites_enemies.jsx EnemyFlutter().
       Tokens resolved to hex (sprites are not CSS-var themed at runtime):
       wings blossom-mid #ff6fa5 / luna-mid #b388ff; gold dots #ffd700;
       body literals #3a2563 / #4a2f7a; eyes #fff.
       Delicate flier — sits smaller in the 100x100 box than grub.
       Wings carry a static petal-glow (feGaussianBlur); flutter/bob CSS keyframes DEFERRED (juice slice). -->
  <defs>
    <filter id="flutter-wing-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
      <feFlood flood-color="#ff6fa5" flood-opacity="0.7"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="50" cy="90" rx="14" ry="4" fill="#000" opacity="0.18"/>
  <g filter="url(#flutter-wing-glow)">
    <!-- wings -->
    <ellipse cx="34" cy="42" rx="15" ry="18" fill="#ff6fa5"/>
    <ellipse cx="36" cy="62" rx="11" ry="13" fill="#b388ff"/>
    <ellipse cx="66" cy="42" rx="15" ry="18" fill="#ff6fa5"/>
    <ellipse cx="64" cy="62" rx="11" ry="13" fill="#b388ff"/>
    <circle cx="32" cy="40" r="4" fill="#ffd700"/>
    <circle cx="68" cy="40" r="4" fill="#ffd700"/>
  </g>
  <!-- body -->
  <rect x="47" y="38" width="6" height="34" rx="3" fill="#3a2563"/>
  <circle cx="50" cy="38" r="6" fill="#4a2f7a"/>
  <circle cx="47" cy="36" r="1.6" fill="#fff"/>
  <circle cx="53" cy="36" r="1.6" fill="#fff"/>
  <line x1="48" y1="33" x2="45" y2="27" stroke="#4a2f7a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="52" y1="33" x2="55" y2="27" stroke="#4a2f7a" stroke-width="1.4" stroke-linecap="round"/>
</svg>
