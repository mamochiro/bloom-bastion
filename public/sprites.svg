    <g filter="url(#atlas-bl-glow)">
      <rect x="56" y="92" width="8" height="34" rx="4" fill="#c43d77"/>
      <g transform="rotate(0 60 51.86)"><ellipse cx="60" cy="51.86" rx="7.02" ry="9.36" fill="#ff6fa5"/><ellipse cx="60" cy="49.52" rx="3.51" ry="4.68" fill="#ffd6e8" opacity="0.7"/></g>
      <g transform="rotate(72 69.64 58.87)"><ellipse cx="69.64" cy="58.87" rx="7.02" ry="9.36" fill="#ff6fa5"/><ellipse cx="69.64" cy="56.53" rx="3.51" ry="4.68" fill="#ffd6e8" opacity="0.7"/></g>
      <g transform="rotate(144 65.96 70.2)"><ellipse cx="65.96" cy="70.2" rx="7.02" ry="9.36" fill="#ff6fa5"/><ellipse cx="65.96" cy="67.86" rx="3.51" ry="4.68" fill="#ffd6e8" opacity="0.7"/></g>
      <g transform="rotate(216 54.04 70.2)"><ellipse cx="54.04" cy="70.2" rx="7.02" ry="9.36" fill="#ff6fa5"/><ellipse cx="54.04" cy="67.86" rx="3.51" ry="4.68" fill="#ffd6e8" opacity="0.7"/></g>
      <g transform="rotate(288 50.36 58.87)"><ellipse cx="50.36" cy="58.87" rx="7.02" ry="9.36" fill="#ff6fa5"/><ellipse cx="50.36" cy="56.53" rx="3.51" ry="4.68" fill="#ffd6e8" opacity="0.7"/></g>
      <circle cx="60" cy="62" r="12.6" fill="#ffd700" opacity="0.18"/>
      <circle cx="60" cy="62" r="6" fill="#fff"/>
      <circle cx="60" cy="62" r="6" fill="#ffd700" opacity="0.55"/>
      <circle cx="58.2" cy="60.2" r="1.92" fill="#fff" opacity="0.9"/>
    </g>
  </symbol>

