      <rect x="39.6" y="56" width="40.8" height="9.35" rx="5.1" fill="#d2ecff"/>
    </g>
    <circle cx="60" cy="58" r="10.5" fill="#fff" opacity="0.18"/>
    <circle cx="60" cy="58" r="5" fill="#fff"/>
    <circle cx="60" cy="58" r="5" fill="#fff" opacity="0.55"/>
    <circle cx="58.5" cy="56.5" r="1.6" fill="#fff" opacity="0.9"/>
  </symbol>

